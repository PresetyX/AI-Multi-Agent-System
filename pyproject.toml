[project]
name = "ai-multi-agent-system"
version = "0.1.0"
description = "Protótipo de sistema multi-agente em LangGraph: supervisor, workers, revisor e ferramentas com restrições."
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-chroma>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F"]
